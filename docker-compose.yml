services:
  mongodb:
    image: mongo:8
    container_name: google-drive-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: google-drive-mailpit
    ports:
      - "8025:8025"

  cassandra:
    image: cassandra:5
    container_name: google-drive-cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra

  users-service:
    build:
      context: ./backend/users-service
      dockerfile: Dockerfile
    container_name: google-drive-users-service
    ports:
      - "${USERS_SERVICE_PORT}:8081"
    environment:
      PORT: 8081
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: ${MONGO_DB}
      DEFAULT_STORAGE_QUOTA_BYTES: ${DEFAULT_STORAGE_QUOTA_BYTES}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@google-drive.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8081}
    depends_on:
      - mongodb
      - mailpit
  files-service:
    build: ./backend/files-service
    container_name: google-drive-files-service
    environment:
      FILES_SERVICE_PORT: ${FILES_SERVICE_PORT:-8082}
      USERS_SERVICE_URL: http://users-service:8081
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      FILES_DB_NAME: ${FILES_DB_NAME:-files_db}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      STORAGE_PATH: /data/files
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
    ports:
      - "${FILES_SERVICE_PORT:-8082}:${FILES_SERVICE_PORT:-8082}"
    volumes:
      - files_data:/data/files
    depends_on:
      - mongodb
      - users-service

  
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: google-drive-api-gateway
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      USERS_SERVICE_URL: http://users-service:8081
      FILES_SERVICE_URL: http://files-service:8082
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8083
      JWT_SECRET: ${JWT_SECRET}

 
  notifications-service:
    build:
      context: ./backend/notifications-service
      dockerfile: Dockerfile
    container_name: google-drive-notifications-service
    ports:
      - "${NOTIFICATIONS_SERVICE_PORT}:${NOTIFICATIONS_SERVICE_PORT}"
    environment:
      NOTIFICATIONS_SERVICE_PORT: ${NOTIFICATIONS_SERVICE_PORT}
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: ${CASSANDRA_PORT}
    depends_on:
      - cassandra

volumes:
  mongodb_data:
  cassandra_data:
  files_data: