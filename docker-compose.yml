services:
  mongodb:
    image: mongo:8
    container_name: google-drive-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  cassandra:
    image: cassandra:5
    container_name: google-drive-cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra

volumes:
  mongodb_data:
  cassandra_data: