
<div class="auth-container">
  <h1>Verifikacija prijave</h1>
  <p>Unesi šestocifreni OTP kod koji si dobio.</p>

  <form [formGroup]="otpForm" (ngSubmit)="verify()">
    <label for="otp">OTP kod</label>

    <input
      id="otp"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="000000"
      formControlName="otp"
    />

    @if (otpForm.controls.otp.touched && otpForm.controls.otp.invalid) {
      <small>Unesi tačno šest cifara.</small>
    }

    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Provera...' : 'Potvrdi kod' }}
    </button>
  </form>

  <p>
    <a routerLink="/login">Vrati se na prijavu</a>
  </p>
</div>
