<div class="auth-container">
  <h1>Reset lozinke</h1>
  <p>Unesi email adresu i poslaćemo ti kratkotrajan link za novu lozinku.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" placeholder="ime@example.com" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small>Unesi ispravnu email adresu.</small>
    }
    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }
    @if (successMessage) {
      <p class="success-message">{{ successMessage }}</p>
    }
    <button type="submit" [disabled]="loading">
      {{ loading ? 'Slanje...' : 'Pošalji link' }}
    </button>
  </form>

  <p><a routerLink="/login">Nazad na prijavu</a></p>
</div>
