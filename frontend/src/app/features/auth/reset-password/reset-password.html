<div class="auth-container">
  <h1>Nova lozinka</h1>
  <p>Postavi novu jaku lozinku za svoj nalog.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="password">Nova lozinka</label>
    <input id="password" type="password" formControlName="password" />

    <label for="confirm-password">Potvrdi novu lozinku</label>
    <input id="confirm-password" type="password" formControlName="confirm_password" />

    @if (form.hasError('passwordMismatch') && form.controls.confirm_password.touched) {
      <small>Lozinke se ne podudaraju.</small>
    }
    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }
    <button type="submit" [disabled]="loading || !token">
      {{ loading ? 'Čuvanje...' : 'Sačuvaj novu lozinku' }}
    </button>
  </form>

  <p><a routerLink="/login">Nazad na prijavu</a></p>
</div>
